workflows:
  ios-build:
    name: DauDoiLIVE iOS build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build unsigned iOS app
        script: |
          xcodebuild -project DauDoiLIVE.xcodeproj -scheme DauDoiLIVE -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - build/ios/Build/Products/Release-iphoneos/*.app
